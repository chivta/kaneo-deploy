apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaneo
spec:
  ingressClassName: traefik
  rules:
    - host: kaneo.chivtar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kaneo
                port:
                  name: http
